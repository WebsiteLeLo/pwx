services:
  # ── PWX Frontend (Static Site) ─────────────────────────────────────────────
  - type: web
    name: pwx
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/pw-clone run build
    staticPublishPath: ./artifacts/pw-clone/dist/public
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: VITE_API_URL
        value: https://pwx-api.onrender.com

  # ── PWX API Server ──────────────────────────────────────────────────────────
  - type: web
    name: pwx-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DRIVE_API_KEY
        sync: false
