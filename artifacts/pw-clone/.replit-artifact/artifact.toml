kind = "web"
previewPath = "/"
title = "PW Clone"
version = "1.0.0"
id = "artifacts/pw-clone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20318

[services.development]
run = "pnpm --filter @workspace/pw-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pw-clone", "run", "build" ]
publicDir = "artifacts/pw-clone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20318"
BASE_PATH = "/"
